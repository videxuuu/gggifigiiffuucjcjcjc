plugins {
    id 'com.android.application'
}

android {
    namespace 'com.videx.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.videx.app'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firmado con la clave de debug: el APK se instala directo (no es para Play Store)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
